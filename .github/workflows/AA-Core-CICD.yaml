name: AA Test Load


on:
  push:
    branches:
      - test-load
  workflow_dispatch:
 
env:
  CI: false
  NODE_VERSION: "20.10.0"
  PNPM_VERSION: "8.14.1"
  IMAGE_NAMESPACE: rexxx9865

jobs:
  setup:
    runs-on: k8s-runner-set-rahat
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: echo "matrix={\"app\":[\"beneficiary\",\"rahat\"]}" >> $GITHUB_OUTPUT

  build:
    needs: setup
    runs-on: k8s-runner-set-rahat
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Create .env
        run: echo "${{ secrets.ENV_AA_TEST_LOAD }}" > .env

      - name: Install Dependencies
        run: |
          pnpm install
          pnpm prisma:generate

      - name: Build Application
        run: npx nx build ${{ matrix.app }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push with Kaniko
        run: |
          kubectl run kaniko-${{ matrix.app }} \
            --rm -i --restart=Never \
            --namespace=arc-runners \
            --image=gcr.io/kaniko-project/executor:latest \
            --overrides='
            {
              "apiVersion": "v1",
              "spec": {
                "containers": [{
                  "name": "kaniko",
                  "image": "gcr.io/kaniko-project/executor:latest",
                  "args": [
                    "--dockerfile=Dockerfile.${{ matrix.app }}",
                    "--context=dir://$(pwd)",
                    "--destination=${{ env.IMAGE_NAMESPACE }}/rahat-platform-${{ matrix.app }}:test-load",
                    "--cache=true"
                  ],
                  "volumeMounts": [{
                    "name": "docker-config",
                    "mountPath": "/kaniko/.docker"
                  }]
                }],
                "restartPolicy": "Never",
                "volumes": [{
                  "name": "docker-config",
                  "secret": {
                    "secretName": "dockerhub-secret"
                  }
                }]
              }
            }'
